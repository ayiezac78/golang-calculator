unleash:
  # Tests run in milliseconds, so the default timeout is shorter than
  # the time it takes to compile each mutant.
  timeout-coefficient: 20
  # Fail when test quality drops below the current baseline.
  threshold:
    efficacy: 99
    mutant-coverage: 99
  # Test-only helpers; mutating them says nothing about the calculator.
  exclude-files:
    - "internal/"
